<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 720" width="100%" height="100%" style="background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134e4a" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>

    <linearGradient id="mlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="storeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#1c1917" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrow-sky" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#38bdf8" />
    </marker>
    <marker id="arrow-teal" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#2dd4bf" />
    </marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#c084fc" />
    </marker>
    <marker id="arrow-amber" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#fbbf24" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1060" height="720" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Outer Header -->
  <g transform="translate(530, 45)">
    <text text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="800" letter-spacing="1.5">ONCOMATCH SYSTEM ARCHITECTURE</text>
    <text y="24" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="500">Decoupled Full-Stack Architecture &bull; Pre-Exposure Leakage Barrier &bull; Sub-Millisecond Cached Inference</text>
  </g>

  <!-- TIER 1: CLIENT APPLICATION (TOP LEFT) -->
  <g transform="translate(45, 95)">
    <rect width="460" height="265" rx="16" fill="url(#clientGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Header Pill -->
    <rect x="16" y="14" width="428" height="34" rx="8" fill="#0284c7" fill-opacity="0.2" />
    <circle cx="34" cy="31" r="5" fill="#38bdf8" />
    <text x="48" y="36" fill="#38bdf8" font-size="13" font-weight="700">CLIENT LAYER &bull; React 18 SPA + TypeScript + Tailwind</text>
    
    <!-- Component 1 -->
    <rect x="20" y="60" width="195" height="85" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="32" y="82" fill="#f8fafc" font-size="12" font-weight="700">Active Profile Sub-Bar</text>
    <text x="32" y="100" fill="#94a3b8" font-size="10.5">Real-time Tumor Lineage</text>
    <text x="32" y="116" fill="#38bdf8" font-size="10">MCF7 &bull; A549 &bull; HCT-116</text>
    <text x="32" y="132" fill="#64748b" font-size="9.5">COSMIC Verified Metadata</text>

    <!-- Component 2 -->
    <rect x="245" y="60" width="195" height="85" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="257" y="82" fill="#f8fafc" font-size="12" font-weight="700">Master-Detail 4PL View</text>
    <text x="257" y="100" fill="#94a3b8" font-size="10.5">Split Workspace Inspector</text>
    <text x="257" y="116" fill="#38bdf8" font-size="10">Fitted Hill Sigmoidal Curve</text>
    <text x="257" y="132" fill="#64748b" font-size="9.5">80% Empirical Band Interval</text>

    <!-- Component 3 -->
    <rect x="20" y="158" width="195" height="85" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="32" y="180" fill="#f8fafc" font-size="12" font-weight="700">Docked Pinboard Drawer</text>
    <text x="32" y="198" fill="#94a3b8" font-size="10.5">Multi-Curve Superposition</text>
    <text x="32" y="214" fill="#38bdf8" font-size="10">Emerald / Violet / Amber</text>
    <text x="32" y="230" fill="#64748b" font-size="9.5">Side-by-side metric deltas</text>

    <!-- Component 4 (Cache) -->
    <rect x="245" y="158" width="195" height="85" rx="8" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.2" />
    <text x="257" y="180" fill="#38bdf8" font-size="12" font-weight="700">In-Memory Batch Cache</text>
    <text x="257" y="198" fill="#e2e8f0" font-size="10.5">Preloaded 295 Regimens</text>
    <text x="257" y="214" fill="#4ade80" font-size="10">Instant Tier Filtering (&lt;1ms)</text>
    <text x="257" y="230" fill="#94a3b8" font-size="9.5">Sensitive / Intermed / Resistant</text>
  </g>

  <!-- TIER 2: BACKEND SERVER (TOP RIGHT) -->
  <g transform="translate(555, 95)">
    <rect width="460" height="265" rx="16" fill="url(#serverGrad)" stroke="#2dd4bf" stroke-width="1.5" />
    <!-- Header Pill -->
    <rect x="16" y="14" width="428" height="34" rx="8" fill="#0d9488" fill-opacity="0.25" />
    <circle cx="34" cy="31" r="5" fill="#2dd4bf" />
    <text x="48" y="36" fill="#2dd4bf" font-size="13" font-weight="700">APPLICATION SERVER &bull; FastAPI + Python 3.11</text>
    
    <!-- Server Component 1 -->
    <rect x="20" y="60" width="195" height="85" rx="8" fill="#042f2e" stroke="#115e59" stroke-width="1" />
    <text x="32" y="82" fill="#f8fafc" font-size="12" font-weight="700">Prediction Router</text>
    <text x="32" y="100" fill="#2dd4bf" font-size="10.5">POST /api/predict</text>
    <text x="32" y="116" fill="#2dd4bf" font-size="10.5">POST /api/predict/all</text>
    <text x="32" y="132" fill="#5eead4" font-size="9.5">Single &amp; batch inference</text>

    <!-- Server Component 2 -->
    <rect x="245" y="60" width="195" height="85" rx="8" fill="#042f2e" stroke="#115e59" stroke-width="1" />
    <text x="257" y="82" fill="#f8fafc" font-size="12" font-weight="700">Sample Catalog API</text>
    <text x="257" y="100" fill="#2dd4bf" font-size="10.5">GET /api/samples</text>
    <text x="257" y="116" fill="#2dd4bf" font-size="10.5">POST /api/samples</text>
    <text x="257" y="132" fill="#5eead4" font-size="9.5">COSMIC &amp; custom isolates</text>

    <!-- Server Component 3 -->
    <rect x="20" y="158" width="195" height="85" rx="8" fill="#042f2e" stroke="#115e59" stroke-width="1" />
    <text x="32" y="180" fill="#f8fafc" font-size="12" font-weight="700">Visual Analytics API</text>
    <text x="32" y="198" fill="#2dd4bf" font-size="10.5">GET /api/analytics/pca</text>
    <text x="32" y="214" fill="#2dd4bf" font-size="10.5">GET /api/analytics/heatmap</text>
    <text x="32" y="230" fill="#5eead4" font-size="9.5">963-line coordinate stream</text>

    <!-- Server Component 4 -->
    <rect x="245" y="158" width="195" height="85" rx="8" fill="#042f2e" stroke="#115e59" stroke-width="1" />
    <text x="257" y="180" fill="#f8fafc" font-size="12" font-weight="700">Report Streaming API</text>
    <text x="257" y="198" fill="#2dd4bf" font-size="10.5">POST /api/reports/generate</text>
    <text x="257" y="214" fill="#2dd4bf" font-size="10.5">GET /reports/download/{fn}</text>
    <text x="257" y="230" fill="#4ade80" font-size="9.5">Direct binary stream (200 OK)</text>
  </g>

  <!-- Communication Connectors (Client <-> Server) -->
  <g>
    <!-- Right arrow: Request -->
    <path d="M 505, 195 L 550, 195" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#arrow-sky)" />
    <!-- Left arrow: Response -->
    <path d="M 555, 235 L 510, 235" stroke="#2dd4bf" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#arrow-teal)" />
    <rect x="495" y="180" width="70" height="18" rx="4" fill="#0f172a" />
    <text x="530" y="192" text-anchor="middle" fill="#38bdf8" font-size="8.5" font-weight="700">HTTP REST</text>
    <rect x="495" y="240" width="70" height="18" rx="4" fill="#0f172a" />
    <text x="530" y="252" text-anchor="middle" fill="#2dd4bf" font-size="8.5" font-weight="700">JSON / BLOB</text>
  </g>

  <!-- TIER 3: MACHINE LEARNING ENGINE (BOTTOM LEFT) -->
  <g transform="translate(45, 410)">
    <rect width="460" height="260" rx="16" fill="url(#mlGrad)" stroke="#c084fc" stroke-width="1.5" />
    <!-- Header Pill -->
    <rect x="16" y="14" width="428" height="34" rx="8" fill="#7e22ce" fill-opacity="0.25" />
    <circle cx="34" cy="31" r="5" fill="#c084fc" />
    <text x="48" y="36" fill="#c084fc" font-size="13" font-weight="700">ML INFERENCE ENGINE &bull; Strict Zero-Leakage Pipeline</text>
    
    <!-- ML Component 1 -->
    <rect x="20" y="60" width="195" height="82" rx="8" fill="#1e1b4b" stroke="#581c87" stroke-width="1" />
    <text x="32" y="82" fill="#f8fafc" font-size="12" font-weight="700">DrugResponseFeaturizer</text>
    <text x="32" y="99" fill="#c084fc" font-size="10.5">Empirical Bayes Smoothing</text>
    <text x="32" y="115" fill="#94a3b8" font-size="10">Target encoding (k=10)</text>
    <text x="32" y="130" fill="#a855f7" font-size="9.5">Pre-exposure features strictly</text>

    <!-- ML Component 2 -->
    <rect x="245" y="60" width="195" height="82" rx="8" fill="#1e1b4b" stroke="#c084fc" stroke-width="1.2" />
    <text x="257" y="82" fill="#f8fafc" font-size="12" font-weight="700">HistGradientBoosting</text>
    <text x="257" y="99" fill="#c084fc" font-size="10.5">MAE: 1.0270 &bull; R&sup2;: 0.7585</text>
    <text x="257" y="115" fill="#4ade80" font-size="10">51.3% error reduction vs mean</text>
    <text x="257" y="130" fill="#a855f7" font-size="9.5">Tuned production refit (222 KB)</text>

    <!-- ML Component 3 -->
    <rect x="20" y="154" width="195" height="82" rx="8" fill="#1e1b4b" stroke="#581c87" stroke-width="1" />
    <text x="32" y="176" fill="#f8fafc" font-size="12" font-weight="700">4PL Sigmoidal Model</text>
    <text x="32" y="193" fill="#c084fc" font-size="10.5">Hill Equation Simulation</text>
    <text x="32" y="209" fill="#94a3b8" font-size="10">Viability(C) = [0, 100%]</text>
    <text x="32" y="224" fill="#a855f7" font-size="9.5">IC50 &plusmn; 1.282 &times; MAE (80% CI)</text>

    <!-- ML Component 4 -->
    <rect x="245" y="154" width="195" height="82" rx="8" fill="#1e1b4b" stroke="#581c87" stroke-width="1" />
    <text x="257" y="176" fill="#f8fafc" font-size="12" font-weight="700">Server Tissue Cache</text>
    <text x="257" y="193" fill="#c084fc" font-size="10.5">In-Memory Singleton Dict</text>
    <text x="257" y="209" fill="#4ade80" font-size="10">Sub-microsecond retrieval</text>
    <text x="257" y="224" fill="#a855f7" font-size="9.5">Pre-warmed BRCA &amp; TCGA</text>
  </g>

  <!-- TIER 4: DATA & STORAGE (BOTTOM RIGHT) -->
  <g transform="translate(555, 410)">
    <rect width="460" height="260" rx="16" fill="url(#storeGrad)" stroke="#fbbf24" stroke-width="1.5" />
    <!-- Header Pill -->
    <rect x="16" y="14" width="428" height="34" rx="8" fill="#b45309" fill-opacity="0.25" />
    <circle cx="34" cy="31" r="5" fill="#fbbf24" />
    <text x="48" y="36" fill="#fbbf24" font-size="13" font-weight="700">PERSISTENT STORAGE &bull; GDSC2 Corpus &amp; Artifacts</text>
    
    <!-- Store Component 1 -->
    <rect x="20" y="60" width="195" height="82" rx="8" fill="#1c1917" stroke="#78350f" stroke-width="1" />
    <text x="32" y="82" fill="#f8fafc" font-size="12" font-weight="700">GDSC2 Gold Standard</text>
    <text x="32" y="99" fill="#fbbf24" font-size="10.5">242,036 Dose Curves</text>
    <text x="32" y="115" fill="#94a3b8" font-size="10">969 Reference Cell Lines</text>
    <text x="32" y="130" fill="#f59e0b" font-size="9.5">295 Drugs &bull; 33 TCGA Origins</text>

    <!-- Store Component 2 -->
    <rect x="245" y="60" width="195" height="82" rx="8" fill="#1c1917" stroke="#78350f" stroke-width="1" />
    <text x="257" y="82" fill="#f8fafc" font-size="12" font-weight="700">PCA Pharmacogenomics</text>
    <text x="257" y="99" fill="#fbbf24" font-size="10.5">963 Lines &times; 295 Regimens</text>
    <text x="257" y="115" fill="#94a3b8" font-size="10">PC1 38.45% &bull; PC2 4.40%</text>
    <text x="257" y="130" fill="#f59e0b" font-size="9.5">Coordinates &amp; loadings matrix</text>

    <!-- Store Component 3 -->
    <rect x="20" y="154" width="195" height="82" rx="8" fill="#1c1917" stroke="#78350f" stroke-width="1" />
    <text x="32" y="176" fill="#f8fafc" font-size="12" font-weight="700">15-Probe Assay Panel</text>
    <text x="32" y="193" fill="#fbbf24" font-size="10.5">Chemotherapy Fingerprints</text>
    <text x="32" y="209" fill="#94a3b8" font-size="10">Cross-lineage sensitivity</text>
    <text x="32" y="224" fill="#f59e0b" font-size="9.5">Standardized response probes</text>

    <!-- Store Component 4 -->
    <rect x="245" y="154" width="195" height="82" rx="8" fill="#1c1917" stroke="#78350f" stroke-width="1" />
    <text x="257" y="176" fill="#f8fafc" font-size="12" font-weight="700">Reports Archive</text>
    <text x="257" y="193" fill="#fbbf24" font-size="10.5">PyMuPDF Vector Reports</text>
    <text x="257" y="209" fill="#94a3b8" font-size="10">295-compound CSV files</text>
    <text x="257" y="224" fill="#4ade80" font-size="9.5">SHA-256 Reproducibility log</text>
  </g>

  <!-- Connectors from Server to ML & Storage -->
  <!-- Server -> ML Engine -->
  <path d="M 670, 360 L 670, 385 L 380, 385 L 380, 405" stroke="#c084fc" stroke-width="2.5" marker-end="url(#arrow-purple)" />
  <rect x="475" y="375" width="140" height="18" rx="4" fill="#0f172a" stroke="#6b21a8" stroke-width="1" />
  <text x="545" y="387" text-anchor="middle" fill="#c084fc" font-size="8.5" font-weight="700">FEATURIZE &amp; INFERENCE</text>

  <!-- Server -> Storage -->
  <path d="M 885, 360 L 885, 405" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrow-amber)" />
  <rect x="830" y="375" width="110" height="18" rx="4" fill="#0f172a" stroke="#78350f" stroke-width="1" />
  <text x="885" y="387" text-anchor="middle" fill="#fbbf24" font-size="8.5" font-weight="700">JSON &amp; FILE I/O</text>
</svg>
