name: OncoMatch CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package.json

    - name: Install Frontend Dependencies & Build Assets
      run: |
        cd frontend
        npm ci
        npm run build

    - name: Run Backend & Machine Learning Verification Tests
      run: |
        pytest tests/ -v

  deploy-zero-cost:
    needs: test-and-verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Deploy to Hugging Face Spaces (Zero-Cost 16GB RAM Container)
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
      if: env.HF_TOKEN != ''
      run: |
        git config --global user.email "bot@oncomatch.org"
        git config --global user.name "OncoMatch Deploy Bot"
        git remote add space https://user:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE_NAME
        git push --force space main
